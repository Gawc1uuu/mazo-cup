services:
  db:
    image: postgres:15
    container_name: mazo-container
    environment:
      POSTGRES_USER: example_user
      POSTGRES_PASSWORD: example_password
      POSTGRES_DB: mazo-db
    ports:
      - '5500:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data # Named volume for Postgres data
    networks:
      - backend
      
networks:
  backend:

volumes:
  postgres-data: # Named volume definition
